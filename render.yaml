# Render Blueprint — see PROJECT_BRIEF.md section 1/5/6.
#
# Spins up: FastAPI backend, Next.js frontend, and a managed Postgres database,
# wired together via env vars. Deploy with Render's "New +" -> "Blueprint",
# pointed at this repo.
#
# Free-tier note: Render's free Postgres databases are deleted 30 days after
# creation unless upgraded to a paid plan — fine for evaluating this, not for
# leaving it running long-term. Bump `plan:` below when that matters.
#
# Cross-service URLs (NEXT_PUBLIC_API_URL, FRONTEND_URL below) are wired via
# fromService + envVarKey: RENDER_EXTERNAL_URL — Render auto-injects
# RENDER_EXTERNAL_URL into every web service with its own full public URL
# (e.g. https://fpl-backend-roie.onrender.com), so these stay correct even
# if Render assigns a different subdomain than the `name:` field suggests
# (it does this silently when a name collides with someone else's service —
# names must be globally unique across all of Render, not just this repo).
# fromService's other property (host/port/hostport) is private-network only
# and won't resolve from a browser, which is what broke this the first time.

databases:
  - name: fpl-db
    plan: free
    databaseName: fpl
    user: fpl

services:
  - type: web
    name: fpl-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Run pending migrations before serving traffic, then start the API.
    # `alembic upgrade head` is idempotent — safe to run on every deploy.
    startCommand: >-
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: fpl-db
          property: connectionString
      - key: FPL_API_BASE
        value: https://fantasy.premierleague.com/api
      - key: FRONTEND_URL
        fromService:
          type: web
          name: fpl-frontend
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: fpl-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    # NEXT_PUBLIC_* vars are inlined at build time, so this must be set
    # before `next build` runs, not just at runtime — Render exposes a
    # service's envVars to its own build step, so this Just Works.
    startCommand: npm run start -- -p $PORT
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: fpl-backend
          envVarKey: RENDER_EXTERNAL_URL
