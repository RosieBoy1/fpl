# Render Blueprint — see PROJECT_BRIEF.md section 1/5/6.
#
# Spins up: FastAPI backend, Next.js frontend, and a managed Postgres database,
# wired together via env vars. Deploy with Render's "New +" -> "Blueprint",
# pointed at this repo.
#
# Free-tier note: Render's free Postgres databases are deleted 30 days after
# creation unless upgraded to a paid plan — fine for evaluating this, not for
# leaving it running long-term. Bump `plan:` below when that matters.
#
# Predictable-URL note: NEXT_PUBLIC_API_URL and FRONTEND_URL below are set to
# Render's default `https://<service-name>.onrender.com` URLs, derived from
# the `name:` fields in this file. If you rename a service or attach a custom
# domain, update the other service's matching env var to match.

databases:
  - name: fpl-db
    plan: free
    databaseName: fpl
    user: fpl

services:
  - type: web
    name: fpl-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Run pending migrations before serving traffic, then start the API.
    # `alembic upgrade head` is idempotent — safe to run on every deploy.
    startCommand: >-
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: fpl-db
          property: connectionString
      - key: FPL_API_BASE
        value: https://fantasy.premierleague.com/api
      - key: FRONTEND_URL
        value: https://fpl-frontend.onrender.com

  - type: web
    name: fpl-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    # NEXT_PUBLIC_* vars are inlined at build time, so this must be set
    # before `next build` runs, not just at runtime — Render exposes a
    # service's envVars to its own build step, so this Just Works.
    startCommand: npm run start -- -p $PORT
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_PUBLIC_API_URL
        value: https://fpl-backend.onrender.com
